<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Aydream Actions Console</title>
  <link rel="stylesheet" href="/panel/style.css">
</head>
<body>
  <main class="shell">
    <header class="hero">
      <div>
        <p class="eyebrow">GITHUB ACTIONS</p>
        <h1>Aydream Console</h1>
        <p class="sub">Run or stop the Aydream GitHub Actions workflow.</p>
      </div>
      <div id="statusPill" class="pill offline">OFFLINE</div>
    </header>
    <section class="card console-card">
      <div class="card-head">
        <div>
          <p class="label">WORKFLOW</p>
          <h2 id="statusText">Loading status…</h2>
        </div>
        <div id="runNumber" class="run-number">—</div>
      </div>
      <div class="facts">
        <div><span>Run status</span><strong id="runStatus">—</strong></div>
        <div><span>Conclusion</span><strong id="runConclusion">—</strong></div>
        <div><span>Started</span><strong id="runStarted">—</strong></div>
        <div><span>Last updated</span><strong id="runUpdated">—</strong></div>
      </div>
      <div class="actions">
        <button id="runButton" class="primary">Run</button>
        <button id="stopButton" class="danger">Stop</button>
        <button id="refreshButton" class="secondary">Refresh</button>
      </div>
      <a id="githubLink" class="github-link" href="#" target="_blank" rel="noreferrer">Open GitHub Actions run</a>
    </section>
    <section class="card logs-card">
      <div class="card-head">
        <div>
          <p class="label">CONSOLE</p>
          <h2>Workflow jobs</h2>
        </div>
      </div>
      <div id="logs" class="logs"><div class="empty">Loading…</div></div>
    </section>
    <div id="toast" class="toast"></div>
  </main>
  <script src="/panel/app.js"></script>
</body>
</html>
