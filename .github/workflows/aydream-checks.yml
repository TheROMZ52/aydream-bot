name: Aydream Checks

on:
  push:
    paths:
      - "bot.js"
      - "lib/**"
      - "test/**"
      - "api/**"
      - "panel/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/aydream-checks.yml"
  pull_request:
    paths:
      - "bot.js"
      - "lib/**"
      - "test/**"
      - "api/**"
      - "panel/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/aydream-checks.yml"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node --check bot.js
      - run: node --check lib/api-security.js
      - run: node --check lib/navigation.js
      - run: node --check lib/setup-input.js
      - run: node --check api/_github.js
      - run: node --check api/logs.js
      - run: node --check api/start.js
      - run: node --check api/status.js
      - run: node --check api/stop.js
      - run: node --check panel/app.js
      - run: npm test
