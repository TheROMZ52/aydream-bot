name: Aydream Checks

on:
  push:
    paths:
      - "bot.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/aydream-checks.yml"
  pull_request:
    paths:
      - "bot.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/aydream-checks.yml"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node --check bot.js
