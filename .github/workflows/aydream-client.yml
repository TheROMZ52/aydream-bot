name: Build Aydream Client

on:
  push:
    paths:
      - "aydream-client/**"
      - ".github/workflows/aydream-client.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aydream-client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - run: chmod +x gradlew
      - run: ./gradlew --version
      - run: ./gradlew build --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: AydreamClient-1.0.0
          path: aydream-client/build/libs/*.jar
          if-no-files-found: error
