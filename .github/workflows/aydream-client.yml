name: Build Aydream Client

on:
  push:
    paths:
      - "aydream-client/**"
      - ".github/workflows/aydream-client.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aydream-client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - run: chmod +x gradlew
      - run: ./gradlew --version
      - run: ./gradlew build --stacktrace
      - name: Publish latest release
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep '^version = ' aydream-client/build.gradle | sed -E 's/version = "([^"]+)"/\1/')
          if ! gh release view latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create latest --repo "$GITHUB_REPOSITORY" --title "Aydream Latest" --notes "version=$VERSION" --latest
          else
            gh release edit latest --repo "$GITHUB_REPOSITORY" --title "Aydream Latest" --notes "version=$VERSION" --latest
          fi
          JAR=$(find aydream-client/build/libs -maxdepth 1 -type f -name "AydreamClient-*.jar" ! -name "*sources*" | head -n 1)
          test -n "$JAR"
          cp "$JAR" aydream-client/build/libs/AydreamClient.jar
          gh release upload latest aydream-client/build/libs/AydreamClient.jar --repo "$GITHUB_REPOSITORY" --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: AydreamClient
          path: aydream-client/build/libs/*.jar
          if-no-files-found: error